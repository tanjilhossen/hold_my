<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4"/>

  <!-- Antenna -->
  <line x1="50" y1="12" x2="50" y2="24" stroke="url(#botGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="11" r="5" fill="#38bdf8"/>

  <!-- Robot Ears -->
  <rect x="16" y="42" width="8" height="18" rx="4" fill="#38bdf8"/>
  <rect x="76" y="42" width="8" height="18" rx="4" fill="#38bdf8"/>

  <!-- Robot Head -->
  <rect x="22" y="24" width="56" height="54" rx="14" fill="url(#botGrad)"/>

  <!-- Face Screen / Visor -->
  <rect x="28" y="32" width="44" height="38" rx="10" fill="#0f172a"/>

  <!-- Glowing Robot Eyes -->
  <circle cx="39" cy="48" r="7.5" fill="url(#eyeGrad)"/>
  <circle cx="61" cy="48" r="7.5" fill="url(#eyeGrad)"/>
  <circle cx="41" cy="46" r="2.5" fill="#ffffff"/>
  <circle cx="63" cy="46" r="2.5" fill="#ffffff"/>

  <!-- Robot Mouth -->
  <line x1="42" y1="62" x2="58" y2="62" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
